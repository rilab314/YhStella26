[project]
name = "stella"
version = "0.1.0"
description = "STELLA — satellite lane detection with token-based connectivity heads"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "pytorch-lightning>=2.4",
    "torchmetrics>=1.4",
    "transformers>=4.55",
    "timm>=1.0",
    "numpy>=1.26",
    "einops>=0.8",
    "scipy>=1.11",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stella", "configs"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy tests (full build, model forward)"]
